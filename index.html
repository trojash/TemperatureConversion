<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion Program</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <form>
        <h1>Temperature conversion</h1>
        <input type="number" id="textBox1" value="0">
        <br>
        <input type="radio" id="fahBtn" name="unit">
        <label for="fahBtn">Celsius -> Fahrenheit</label><br>

        <input type="radio" id="celsiusBtn" name="unit">
        <label for="celsiusBtn">Fahrenheit -> Celsius</label><br>

        <button type="submit" id="mySubmit">Submit</button>
        <br>
        <p id="results">

        </p>
    </form>
    <script src="js/script.js"></script>
</body>

</html>
